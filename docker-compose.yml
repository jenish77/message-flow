version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: messageflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messageflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messageflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
